name: medical-imaging

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18501}:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      HF_HOME: /home/app/.cache/huggingface
      TORCH_HOME: /home/app/.cache/torch
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
      - hf_cache:/home/app/.cache/huggingface
      - torch_cache:/home/app/.cache/torch
    depends_on:
      ollama:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    security_opt:
      - no-new-privileges:true

volumes:
  hf_cache:
  torch_cache:
  ollama_data:
