# Apply with: docker compose -p medical-imaging -f compose.yaml -f compose.production.yaml up -d
# Requires NVIDIA Container Toolkit and an available GPU.
services:
  dashboard:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    pids_limit: 512
    shm_size: "1gb"
    volumes:
      - ./deploy/secrets.toml:/app/.streamlit/secrets.toml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ollama:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
